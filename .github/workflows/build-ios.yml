name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          brew install --cask powershell 2>/dev/null || true

      - name: Install kivy-ios toolchain
        run: |
          pip3 install kivy-ios
          toolchain --version

      - name: Build Python and Kivy for iOS (arm64)
        run: |
          toolchain build python3 kivy
        timeout-minutes: 90
        continue-on-error: true

      - name: Create Xcode project
        run: |
          toolchain create YunX ./mobile_gui/
        continue-on-error: true

      - name: Build IPA (simulator-first for validation)
        run: |
          if [ -d "YunX-ios" ]; then
            cd YunX-ios
            xcodebuild -project YunX.xcodeproj -scheme YunX -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
            cd ..
          fi
        continue-on-error: true

      - name: Package unsigned IPA
        run: |
          mkdir -p dist
          if [ -d "YunX-ios/build/Build/Products/Release-iphonesimulator/YunX.app" ]; then
            # Create IPA structure (Payload)
            mkdir -p Payload
            cp -R "YunX-ios/build/Build/Products/Release-iphonesimulator/YunX.app" Payload/
            # Copy source-based IPA template for real device signing
            zip -r "dist/YunX-iOS-${{ github.ref_name }}.ipa" Payload/
            rm -rf Payload
            echo "IPA built successfully"
          else
            # Fallback: create source distribution with build instructions
            echo "Simulator build not available, creating source package with Xcode project"
            if [ -d "YunX-ios" ]; then
              zip -r "dist/YunX-iOS-Source-${{ github.ref_name }}.zip" YunX-ios/
            fi
          fi
          ls -la dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-iOS
          path: dist/
          retention-days: 30
