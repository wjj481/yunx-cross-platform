name: Build Desktop (Windows/macOS/Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------- Windows ----------------
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (64-bit)
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Set up Python (32-bit)
        if: matrix.arch == 'x86'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen
          pip install -r requirements-core.txt

      - name: Build with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm --clean desktop_gui/desktop_gui.spec
        shell: pwsh

      - name: Package release
        run: |
          mkdir -p dist
          $exe = Get-ChildItem -Path dist -Filter "YunX.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist/YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe"
          } else {
            Write-Error "YunX.exe not found"
            exit 1
          }
          Get-FileHash "dist/YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe" } | Out-File -Append "dist/SHA256SUMS.txt"
        shell: pwsh

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe

  # ---------------- macOS arm64 (Apple Silicon) ----------------
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tkinter
        run: python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen
          pip install -r requirements-core.txt

      - name: Build with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm --clean desktop_gui/desktop_gui.spec

      - name: Package release
        run: |
          mkdir -p dist
          # PyInstaller onefile 产物
          if [ -f "dist/YunX" ]; then
            cp "dist/YunX" "dist/YunX-macOS-arm64-${{ github.ref_name }}"
            chmod +x "dist/YunX-macOS-arm64-${{ github.ref_name }}"
          else
            echo "::error::dist/YunX not found"
            ls -la dist/ || true
            exit 1
          fi
          shasum -a 256 "dist/YunX-macOS-arm64-${{ github.ref_name }}" | awk '{print tolower($1)"  "$2}' >> "dist/SHA256SUMS.txt"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YunX-macOS-arm64-${{ github.ref_name }}

  # ---------------- macOS x86_64 (Intel) ----------------
  build-macos-x86_64:
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tkinter
        run: python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen
          pip install -r requirements-core.txt

      - name: Build with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm --clean desktop_gui/desktop_gui.spec

      - name: Package release
        run: |
          mkdir -p dist
          if [ -f "dist/YunX" ]; then
            cp "dist/YunX" "dist/YunX-macOS-x86_64-${{ github.ref_name }}"
            chmod +x "dist/YunX-macOS-x86_64-${{ github.ref_name }}"
          else
            echo "::error::dist/YunX not found"
            ls -la dist/ || true
            exit 1
          fi
          shasum -a 256 "dist/YunX-macOS-x86_64-${{ github.ref_name }}" | awk '{print tolower($1)"  "$2}' >> "dist/SHA256SUMS.txt"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YunX-macOS-x86_64-${{ github.ref_name }}

  # ---------------- Linux ----------------
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen
          pip install -r requirements-core.txt

      - name: Build with PyInstaller (spec)
        run: |
          pyinstaller --noconfirm --clean desktop_gui/desktop_gui.spec

      - name: Package release
        run: |
          mkdir -p dist
          if [ -f "dist/YunX" ]; then
            cp "dist/YunX" "dist/YunX-Linux-x86_64-${{ github.ref_name }}"
            chmod +x "dist/YunX-Linux-x86_64-${{ github.ref_name }}"
          else
            echo "::error::dist/YunX not found"
            ls -la dist/ || true
            exit 1
          fi
          shasum -a 256 "dist/YunX-Linux-x86_64-${{ github.ref_name }}" | awk '{print tolower($1)"  "$2}' >> "dist/SHA256SUMS.txt"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YunX-Linux-x86_64-${{ github.ref_name }}
