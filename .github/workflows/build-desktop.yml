name: Build Desktop (Windows/macOS/Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, x86]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (64-bit)
        if: matrix.arch == 'x64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Set up Python (32-bit)
        if: matrix.arch == 'x86'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x86'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests aiohttp cryptography
          pip install -r requirements-core.txt

      - name: Build with PyInstaller
        run: |
          cd desktop_gui
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "YunX-${{ matrix.arch }}" `
            --icon ../assets/icon.ico `
            --add-data "../core;core" `
            --hidden-import aiohttp `
            --hidden-import cryptography `
            main.py
        shell: pwsh

      - name: Package release
        run: |
          mkdir -p dist
          $exe = Get-ChildItem -Path desktop_gui/dist -Filter *.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist/YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe"
          }
          Get-FileHash "dist/YunX-Windows-${{ matrix.arch }}-${{ github.ref_name }}.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Split('\')[-1])" } | Out-File -Append "dist/SHA256SUMS.txt"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-Windows-${{ matrix.arch }}
          path: dist/

  build-macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller requests aiohttp cryptography
          pip install -r requirements-core.txt

      - name: Build with PyInstaller
        run: |
          cd desktop_gui
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "YunX-macOS" \
            --add-data "../core:core" \
            --hidden-import aiohttp \
            --hidden-import cryptography \
            main.py

      - name: Package release
        run: |
          mkdir -p dist
          if [ -f "desktop_gui/dist/YunX-macOS" ]; then
            cp "desktop_gui/dist/YunX-macOS" "dist/YunX-macOS-${{ github.ref_name }}"
            chmod +x "dist/YunX-macOS-${{ github.ref_name }}"
          fi
          if [ -d "desktop_gui/dist/YunX-macOS.app" ]; then
            cd desktop_gui/dist
            zip -r "../../dist/YunX-macOS-${{ github.ref_name }}.zip" "YunX-macOS.app"
            cd ../..
          fi
          shasum -a 256 dist/* >> dist/SHA256SUMS.txt 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-macOS
          path: dist/

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          pip install --upgrade pip
          pip install pyinstaller requests aiohttp cryptography
          pip install -r requirements-core.txt

      - name: Build with PyInstaller
        run: |
          cd desktop_gui
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "YunX-Linux" \
            --add-data "../core:core" \
            --hidden-import aiohttp \
            --hidden-import cryptography \
            main.py

      - name: Package release
        run: |
          mkdir -p dist
          if [ -f "desktop_gui/dist/YunX-Linux" ]; then
            cp "desktop_gui/dist/YunX-Linux" "dist/YunX-Linux-${{ github.ref_name }}"
            chmod +x "dist/YunX-Linux-${{ github.ref_name }}"
          fi
          shasum -a 256 dist/* >> dist/SHA256SUMS.txt 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-Linux
          path: dist/
