name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare source (copy core/assets into mobile_gui)
        run: |
          # buildozer.spec 中 source.dir = . (mobile_gui/)
          # core/ 和 assets/ 在项目根，需要复制进来
          rm -rf mobile_gui/core mobile_gui/assets
          cp -r core mobile_gui/core
          mkdir -p mobile_gui/assets
          if [ -d assets ]; then cp -r assets/* mobile_gui/assets/ 2>/dev/null || true; fi
          ls -la mobile_gui/ | head -20

      - name: Build APK with kivy/buildozer Docker image
        run: |
          # 使用官方 kivy/buildozer 镜像，避免裸机环境依赖问题
          # (Ubuntu 24.04 已移除 libtinfo5、autoconf 2.72 与 libffi autogen 不兼容)
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project/mobile_gui \
            kivy/buildozer:latest \
            bash -c "yes | buildozer -v android debug && chmod -R a+rw /project"
        timeout-minutes: 150

      - name: Find and copy APK
        run: |
          mkdir -p dist
          APK_FILE=$(find mobile_gui/bin -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/YunX-Android-${{ github.ref_name }}.apk"
            echo "APK built: $APK_FILE"
            ls -lh dist/
            shasum -a 256 "dist/YunX-Android-${{ github.ref_name }}.apk" | awk '{print tolower($1)"  "$2}' >> "dist/SHA256SUMS.txt"
          else
            echo "::error::No APK produced. Listing bin directory:"
            find mobile_gui/bin -type f 2>/dev/null || echo "(no bin dir)"
            exit 1
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YunX-Android-${{ github.ref_name }}.apk
